name: Deploy frontend to Azure Static Web Apps

on:
  push:
    branches: [master]
    paths:
      - "portalweb/**"
      - ".github/workflows/azure-swa.yml"
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and deploy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Build (Vite)
        working-directory: portalweb
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_ASSETS_URL: ${{ secrets.VITE_ASSETS_URL }}
        run: |
          npm ci
          npm run build

      # Los PDFs pesados (documentos y certificados) se sirven desde Azure Blob
      # Storage, no desde el Static Web App (que tiene límite de 250MB). Los
      # quitamos del bundle antes de publicar.
      - name: Quitar assets pesados del bundle de SWA
        run: rm -rf portalweb/dist/documents portalweb/dist/certificates

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "upload"
          # Ya viene compilado por el paso anterior (con las VITE_ del build)
          skip_app_build: true
          app_location: "portalweb/dist"
          output_location: ""
