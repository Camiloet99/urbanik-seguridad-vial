server:
  port: 8080

spring:
  r2dbc:
    # sslMode: DISABLED en local (MySQL de docker sin TLS); REQUIRED en Azure
    # MySQL Flexible Server, que exige conexiones cifradas.
    url: r2dbc:pool:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:iu_auth}?serverTimezone=UTC&sslMode=${DB_SSL_MODE:DISABLED}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
  sql:
    init:
      mode: never

app:
  # Orígenes permitidos por CORS, separados por coma. Se sobreescribe por entorno
  # (APP_CORS_ORIGINS) para no recompilar la imagen al cambiar de dominio.
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://48.211.210.195,http://vial.urbanik-hub.com,https://vial.urbanik-hub.com}
  nivel99:
    base-url: "https://nivel99.com"
  jwt:
    secret: ${JWT_SECRET:EPzuE1fY/zKURZ0eklR27ULNZTpAO51+dfDWt3iJRI7zyv+UdDjXaDlkV7X1I04r89mvdet5CAWSFkfrKv+fmg==}
    access-minutes: 120

  # IA de NIA vía Azure OpenAI. La key vive SOLO aquí (secreto del backend),
  # nunca en el frontend.
  openai:
    endpoint: ${AZURE_OPENAI_ENDPOINT:}
    key: ${AZURE_OPENAI_KEY:}
    deployment: ${AZURE_OPENAI_DEPLOYMENT:gpt-4o-mini}
    api-version: ${AZURE_OPENAI_API_VERSION:2024-08-01-preview}